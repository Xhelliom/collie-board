name: Release

# Two ways a version ships (ADR 0016):
#
# - `cut`: after a GREEN CI run on a push to main, fold the fragments in changes/ into a release —
#   CHANGELOG entry, the three version files, the commit, the vX.Y.Z tag, the GitHub Release. No
#   fragment, nothing to do. Branches never cut a version, so they never conflict over one.
# - `publish`: a vX.Y.Z tag pushed by hand still becomes a GitHub Release, as before.
#
# The GitHub Release is created here and not left to the tag: a tag pushed with GITHUB_TOKEN starts
# no workflow, so `publish` would never see the ones `cut` pushes. Same notes either way
# (scripts/release-notes.sh) — the in-app update banner links to that page.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # the release commit, the tag, the release

# One release at a time, never cancelled half-way: a run stopped between the push and the release
# would leave a tag with no page for the update banner to land on.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  cut:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0 # release.ts cites the commit each fragment came in with
      - uses: oven-sh/setup-bun@v2

      - name: Fold the fragments into a release
        id: cut
        run: echo "version=$(bun scripts/release.ts)" >> "$GITHUB_OUTPUT"

      - name: Commit, tag, push
        if: steps.cut.outputs.version != ''
        env:
          VERSION: ${{ steps.cut.outputs.version }}
        run: |
          set -euo pipefail
          bash scripts/check-version.sh
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          git add -A CHANGELOG.md herdr-plugin.toml package.json web/package.json changes/
          git commit -m "chore(release): $VERSION"
          git tag -a "v$VERSION" -m "Collie $VERSION"
          # Atomic: the commit and its tag land together or not at all. A main that moved meanwhile
          # refuses the push, and the next green run releases everything still waiting.
          git push --atomic origin HEAD:main "v$VERSION"

      - name: Create GitHub release
        if: steps.cut.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.cut.outputs.version }}
        run: |
          bash scripts/release-notes.sh "$VERSION" > "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" --title "Collie v$VERSION" --notes-file "$RUNNER_TEMP/notes.md"

  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --title "Collie $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
