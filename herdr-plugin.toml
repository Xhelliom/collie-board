id = "herdr.collie-board"
name = "Collie Board"
version = "0.318.0"
min_herdr_version = "0.7.0"
description = "Durable Kanban cards over your Herdr agent herd — worktree per card, handoffs, mobile PWA"
platforms = ["linux", "macos", "windows"]

# This plugin is a thin launcher. The actual bridge runs supervised outside Herdr so it outlives
# Herdr restarts (see ARCHITECTURE.md §3): a systemd --user service on Linux, a scheduled task at
# logon on Windows. The actions get HERDR_SOCKET_PATH / HERDR_PLUGIN_CONFIG_DIR injected.
#
# Every action Windows offers is `bun scripts/ctl.ts <id>` on EVERY platform: Herdr refuses two
# actions with one id whatever their `platforms`, and has no per-platform command (ADR 0050).
# ctl.ts hands the command to scripts/collie-board-ctl.sh on Linux/macOS, and runs it itself on
# Windows. The one it can't run there yet (setup) keeps the bash command, Linux/macOS only.
# `update-bash` is `update` without bun: a host whose Herdr can't see bun can still update.

# Build the web UI at install time. Herdr runs [[build]] steps ONLY on `herdr plugin install`
# (GitHub) — NOT on `herdr plugin link` (local dev), which instead builds lazily on first `start`
# (collie-board-ctl.sh's ensure_build). Delegating to `collie-board-ctl.sh build` keeps a single build
# definition (version gate → cd web && bun install && bun run build) shared with the `update` action.
# Still needs Bun on PATH — building the frontend is the one unavoidable Bun step.
[[build]]
command = ["bash", "scripts/collie-board-ctl.sh", "build"]
platforms = ["linux", "macos"]

# Windows has no bash: the same build (version gate, both installs, both typechecks, staged swap)
# from ctl.ts. [[build]] entries carry no id, so one per platform is fine — unlike actions.
[[build]]
command = ["bun", "scripts/ctl.ts", "build"]
platforms = ["windows"]

# First-run bootstrap: preflight, link, and derive the two security settings from `tailscale status`
# so the safe configuration is the default one. Deliberately starts and publishes nothing.
[[actions]]
id = "setup"
title = "Set up (preflight + config)"
contexts = ["workspace"]
command = ["bash", "scripts/collie-board-ctl.sh", "setup"]
platforms = ["linux", "macos"]

[[actions]]
id = "start"
title = "Start web bridge"
contexts = ["workspace"]
command = ["bun", "scripts/ctl.ts", "start"]

[[actions]]
id = "stop"
title = "Stop web bridge"
contexts = ["workspace"]
command = ["bun", "scripts/ctl.ts", "stop"]

[[actions]]
id = "restart"
title = "Restart web bridge"
contexts = ["workspace"]
command = ["bun", "scripts/ctl.ts", "restart"]

# Full teardown: stops + disables the service, removes the systemd --user unit, and resets
# tailscale serve. Leaves the .env and the checkout (so `start` can bring it right back). See
# scripts/collie-board-ctl.sh → cmd_uninstall.
[[actions]]
id = "uninstall"
title = "Uninstall web bridge (remove service)"
contexts = ["workspace"]
command = ["bun", "scripts/ctl.ts", "uninstall"]

# The plugin IS its on-disk git checkout, so this action advances it (pull, or fetch + detach for a
# Herdr-managed install) + rebuilds + restarts in one step. See scripts/ctl.ts → updateCheckout.
[[actions]]
id = "update"
title = "Update plugin"
contexts = ["workspace"]
command = ["bun", "scripts/ctl.ts", "update"]

# The same update straight through bash, for a Linux/macOS host whose Herdr doesn't see bun on its
# PATH (ADR 0050). Settings → Updates invokes this one there, so the button never needs bun on PATH.
[[actions]]
id = "update-bash"
title = "Update plugin (without bun on Herdr's PATH)"
contexts = ["workspace"]
command = ["bash", "scripts/collie-board-ctl.sh", "update-bash"]
platforms = ["linux", "macos"]

[[actions]]
id = "url"
title = "Show bridge URL"
contexts = ["workspace"]
command = ["bun", "scripts/ctl.ts", "url"]

[[actions]]
id = "status"
title = "Bridge status"
contexts = ["workspace"]
command = ["bun", "scripts/ctl.ts", "status"]

[[actions]]
id = "version"
title = "Show version"
contexts = ["workspace"]
command = ["bun", "scripts/ctl.ts", "version"]
