<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- Status bar. ONE value, and it MUST equal the manifest's `theme_color` (web/vite.config.ts).

         This meta does NOT paint the band. The band is the manifest's `theme_color`, baked into the
         WebAPK at install time; the meta only tells Chrome which way to tint the system icons. When
         the two disagree the icons vanish — a light meta over the manifest's black band asked for
         dark icons on black, no clock, no battery (47d0a5f).

         So the band cannot follow the app theme: one WebAPK, one colour, chosen at install. Both
         values were verified against the device before settling here — don't re-litigate it:

         - Two metas scoped with `media="(prefers-color-scheme: …)"`, declared at parse time so none
           of 47d0a5f's runtime-write problem. With the OS in LIGHT mode, so the light meta matched,
           the band stayed black and only the icon tint flipped: 47d0a5f's bug from static HTML.
         - The manifest's `theme_color` set to #ffffff, PWA reinstalled: the band went white. That is
           the lever, and the only one.

         Dark is the value kept. White matched the light theme but put a lit band over the dark one,
         and an Android on a night schedule sees both every day; a dark band is the one that is never
         glaring. Changing it means changing BOTH values and reinstalling the PWA. -->
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Collie Board" />
    <title>Collie Board</title>
    <!-- Anti-FOUC theme script (D2): must run before the boot-splash <style> below is applied, so the
         `.dark` class is already set — or absent — by first paint. Duplicates lib/theme.ts's resolve
         logic in plain JS (that module hasn't loaded yet) — keep the two in sync if the rule changes.
         Defaults to "system" when nothing is stored, same as loadThemeMode().
         It deliberately does NOT touch theme-color — see that meta's comment above. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("collie:theme");
          var mode = stored === "light" || stored === "dark" ? stored : "system";
          var dark = mode === "dark" || (mode === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {}
      })();
    </script>
    <!-- The web manifest <link> is injected by vite-plugin-pwa at build time. -->
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- First-paint splash: the galloping Collie shown the instant the PWA opens, bridging the OS
         launch splash and React mount (createRoot replaces #root, so it clears itself). Critical CSS
         is inlined here so it paints and animates before the app bundle/index.css load — pure CSS,
         no JS. It mirrors routes/root.tsx's BootSplash (same sprite, 4rem, copy) so the hand-off is
         seamless. Sprite math matches .dog-gallop in index.css: dog-gallop.png is a 768×128 strip of
         six 128px frames, stepped with steps(6). -->
    <style>
      .boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        /* Light-mode default. index.css isn't loaded yet (it ships in the JS bundle), so these are
           plain hex approximations of --background/--muted-foreground, not the real tokens. */
        background: #ffffff;
        color: #71717a;
        font: 500 0.875rem/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      html.dark .boot-splash {
        background: #0a0a0a;
        color: #a1a1a1;
      }
      .boot-splash__dog {
        --dog-size: 4rem;
        --dog-frames: 6;
        width: var(--dog-size);
        height: var(--dog-size);
        background: url("/dog-gallop.png") no-repeat 0 0;
        background-size: calc(var(--dog-frames) * var(--dog-size)) var(--dog-size);
        animation: boot-dog-gallop 0.6s steps(6) infinite;
      }
      @keyframes boot-dog-gallop {
        to {
          background-position: calc(-1 * var(--dog-frames) * var(--dog-size)) 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-splash__dog {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-splash" role="status" aria-label="Loading Collie Board">
        <span class="boot-splash__dog" aria-hidden="true"></span>
        <span>Connecting to the herd…</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
